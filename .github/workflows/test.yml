# Tests on every push and pull request: Go against a real PostgreSQL, the
# frontend's unit tests, type check and build. The same commands as in
# docs/development.md.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kaikku_test
          POSTGRES_PASSWORD: kaikku_test
          POSTGRES_DB: kaikku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaikku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kaikku_test:kaikku_test@localhost:5432/kaikku_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ffmpeg for the upload and audio tests; without it they're skipped.
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg postgresql-client
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - run: DATABASE_URL="$TEST_DATABASE_URL" migrations/migrate.sh
      - run: go vet ./...
      # -p 1: the api and ingest packages share the test database.
      - run: go test -p 1 -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx svelte-check
      - run: npm run build
