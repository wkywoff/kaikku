name: kaikku

x-app: &app
  image: ghcr.io/wkywoff/kaikku-app:${KAIKKU_VERSION:-latest}
  restart: unless-stopped
  init: true
  environment: &app-env
    DATABASE_URL: postgres://kaikku:${POSTGRES_PASSWORD:-kaikku}@postgres:5432/kaikku?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaikku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaikku}
      POSTGRES_DB: kaikku
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kaikku", "-d", "kaikku"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 1s

  migrate:
    <<: *app
    build:
      context: .
      target: app
      args:
        VERSION: ${KAIKKU_BUILD_VERSION:-dev}
    command: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: api
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      MEDIA_SECRET: ${MEDIA_SECRET:?set MEDIA_SECRET in .env (openssl rand -hex 32)}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8080}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-600}
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-5120}
      DEEZER_PROXY: ${DEEZER_PROXY:-}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      LRCRED_CONTACT: ${LRCRED_CONTACT:-}
      YTDLP_VERSION: ${YTDLP_VERSION:-}
      YTDLP_UPDATE_HOURS: ${YTDLP_UPDATE_HOURS:-24}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - data:/data
      - ytdlp:/opt/yt-dlp
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      start_interval: 2s
    mem_limit: 600m

  worker:
    <<: *app
    command: worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      AUDIO_KEEP_DAYS: ${AUDIO_KEEP_DAYS:-3}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - data:/data
      - ytdlp:/opt/yt-dlp:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    stop_grace_period: 15m
    mem_limit: 900m

  web:
    image: ghcr.io/wkywoff/kaikku-web:${KAIKKU_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      MEDIA_SECRET: ${MEDIA_SECRET:?set MEDIA_SECRET in .env (openssl rand -hex 32)}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - data:/data:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  data:
  ytdlp:
